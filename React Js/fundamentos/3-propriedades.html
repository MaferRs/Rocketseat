<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocketseta - React.js - Fundamentos</title>
  <link rel="stylesheet" href="/css/style.module.min.css">
</head>

<body>

  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

    // css-in-js
    const buttonVariants = {
      default: {
        backgroundColor: 'pink',
        marginLeft: '2rem'
      },
      primary: {
        backgroundColor: 'green'

      }
    }

    //componente
    function App() {
      return (
        <main>
          <Button variant='primary' title='Meu botão'>Teste</Button>
          <Button type='submit'>Teste 2</Button>
        </main>
      )
    }


    //componente
    function Button({ variant = 'default', children, className, ...props }) {
      return (
        <button
          style={buttonVariants[variant]}
          className={className}
          {...props}
        >
          {children}
        </button>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <App />
    )
  </script>
</body>

</html>
