    <article>

    <div>
        <article>
            <p>
            <h2>Mais um titulo</h2>
            </p>
        </article>
    </div>

    <ul>
        <li>item 1</li>
        <ul>
            <li>item 2</li>
        </ul>
    </ul>




    <h1>
        Titulo
    </h1>
    <p>
        Esse é um paragrafo
    </p>
    <p>
        main um paragrafo
    </p>



    <!-- Combinadores: trabalham para buscar e combinar seletores a fim de aplicar uma estilização.

    *Descendant combinator : identificado por um esoaço entre os seletores., busca um elemento dentro de outro.
    `````css  (body article h2) ````
    

    *
    child combinator: identificado pelo sinal `> ` entre dois seletores
    seleciona somente o elemento que é filho direto do pai.
    elementos depois do filho direto serão considerados.

    `` body >  ul > li ``
    *

    adjacent sibling combinator :
     identificado pelo sinal `+` entre dois seletores
     seleciona somente o elemento do lado direito que é filho direto do pai.

     h1+p
    *
    
    General sibling combinator

    identificado pelo sinal `~` entre dois seletores.
    seleciona todos os elementos irmãps.

    h1~p

    *

    
    -->
